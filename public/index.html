<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Person Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

    <header class="header">
        <div class="header left">
            <div>
                <h1 class="header-title">CRUD Application</h1>
                <p class="header-subtitle">Manage Person Records Easily</p>
            </div>
        </div>
        <span class="live-badge">Live</span>
    </header>

    <main>

        <!-- Dashboard -->
        <section class="stats-row">
            <div class="card">
                <div class="stat-label">Total People</div>
                <div class="stat-value-row">
                    <span class="stat-icon">👥</span>
                    <span class="stat-value" id="totalStudents">0</span>
                </div>
                <p class="stat-caption" id="totalStudentsCaption">0 people in the database</p>
            </div>

            <div class="card">
                <div class="stat-label">Added Today</div>
                <div class="stat-value-row">
                    <span class="stat-icon calendar">📅</span>
                    <span class="stat-value" id="enrolledToday">0</span>
                </div>
                <p class="stat-caption" id="enrolledTodayCaption">No new entries today</p>
            </div>
        </section>

        <!-- Person Form -->
        <section class="card form-section">

            <h2 class="section-title">
                <span class="section-icon">+</span>
                <span id="formTitle">Add Person</span>
            </h2>

            <form id="studentForm">

                <div class="form-grid">
                    <div class="field">
                        <label for="name">Full Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter full name"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email address"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="phone">Phone Number</label>
                        <input
                            type="text"
                            id="phone"
                            placeholder="Enter phone number"
                        >
                    </div>

                    <div class="field">
                        <label for="gender">Gender</label>
                        <select id="gender">
                            <option value="" disabled selected>Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Non-binary">Non-binary</option>
                            <option value="Other">Other</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="course">Course / Role</label>
                        <input
                            type="text"
                            id="course"
                            placeholder="Enter course or role"
                        >
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary">
                    Add Person
                </button>

                <button
                
                    type="button"
                    id="cancelBtn"
                    class="btn btn-secondary hidden"
                >
                    Cancel
                </button>

            </form>

        </section>

        <!-- Search -->
        <section class="search-bar">
            <span class="search-icon">🔍</span>
            <input
                type="text"
                id="searchInput"
                placeholder="Search people..."
            >
        </section>

        <!-- Person Table -->
        <section class="card table-section">

            <h2 class="section-title">
                <span class="section-icon">☰</span>
                <span>Person Records</span>
            </h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Gender</th>
                        <th>Course / Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">
                </tbody>

            </table>

        </section>

    </main>

</div>

    <script src="script.js"></script>

</body>
</html>
